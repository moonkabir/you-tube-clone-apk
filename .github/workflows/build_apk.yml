name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (3.27.4 LTS)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true

      - name: Verify Environment
        run: |
          java -version
          flutter doctor -v

      - name: Ensure Debug Keystore & local.properties
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties

      - name: Make Gradle script executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build_output.log

      - name: Print logs on failure
        if: failure()
        run: |
          echo "==================== BUILD FAILURE TAIL LOG ===================="
          tail -n 150 build_output.log
          FAIL_SNIPPET=$(grep -E -C 3 "FAILURE|BUILD FAILED|Execution failed|What went wrong" build_output.log | head -n 30 || tail -n 20 build_output.log)
          FAIL_SNIPPET="${FAIL_SNIPPET//$'\n'/'%0A'}"
          echo "::error title=Gradle Error::$FAIL_SNIPPET"

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_output.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-tube-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
